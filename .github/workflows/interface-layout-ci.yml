name: Validate editor interface (no deployment)

on:
  push:
    branches:
      - feat/layout-editor-claro
      - feat/gerenciamento-series
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/interface-layout-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/interface-layout-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-layout-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipos, executar testes e compilar
        run: npm run build
