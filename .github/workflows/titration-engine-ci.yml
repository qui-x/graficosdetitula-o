name: Validate titration engine (no deployment)

on:
  push:
    branches:
      - feat/motor-grafico-titulacao
    paths:
      - "app/src/titration-*.ts"
      - "tests/titration-engine.test.ts"
      - "docs/**"
      - ".github/workflows/titration-engine-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
  pull_request:
    branches:
      - feat/editor-graficos-manual
    paths:
      - "app/src/titration-*.ts"
      - "tests/titration-engine.test.ts"
      - "docs/**"
      - ".github/workflows/titration-engine-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titration-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipos, executar testes e compilar
        run: npm run build
